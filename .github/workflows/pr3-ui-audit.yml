name: One-time v0.3 desktop and phone audit
on:
  push:
    branches: ['audit/2026-11-25-pr3-smoke']
    paths: ['.github/workflows/pr3-ui-audit.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: life_dashboard
          POSTGRES_PASSWORD: disposable-smoke-only
          POSTGRES_DB: life_dashboard_v03_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 4s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: v0.3
    env:
      NODE_ENV: test
      PHASE3_ACCEPTANCE: codex-phase3
      PHASE2_ACCEPTANCE: codex
      ACCEPTANCE_PROJECT: life-dashboard-v0-3
      DATABASE_HOST: postgres-test
      DATABASE_NAME: life_dashboard_v03_test
      DATABASE_USER: life_dashboard
      POSTGRES_PASSWORD: disposable-smoke-only
      LOCAL_LOGIN_SECRET: isolated-smoke-only-synthetic-login-phrase
      APP_ORIGIN: http://localhost:18380
      V03_AI_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7120d0c94f1a5314547838fd496780d661555290
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated services and locked packages
        run: |
          echo '127.0.0.1 postgres-test gateway-test' | sudo tee -a /etc/hosts
          npm install --global pnpm@10.18.3
          pnpm install --frozen-lockfile --prod=false
          pnpm exec tsx packages/db/src/migrate.ts
      - name: Start the real web and API with a synthetic model
        if: ${{ !cancelled() }}
        run: |
          node scripts/build-web.mjs
          pnpm exec playwright install chromium --with-deps
          pnpm exec tsx tests/v03-phase2/init.ts
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          pnpm exec tsx tests/v03-phase2/server.ts > "$RUNNER_TEMP/ld-api.log" 2>&1 &
          pnpm exec tsx tests/v03-phase2/worker.ts > "$RUNNER_TEMP/ld-worker.log" 2>&1 &
          WEB_PORT=80 WEB_HOST=127.0.0.1 API_PROXY_TARGET=http://127.0.0.1:3001 APP_ORIGIN=http://gateway-test node apps/web/dev-server.mjs > "$RUNNER_TEMP/ld-web.log" 2>&1 &
          for i in {1..40}; do if curl --noproxy '*' -fsS http://gateway-test/health/ready > /dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Verify six routes, profile, wallet, export and minimal mode
        run: |
          cat > .audit-customer-flows.mjs <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const findings=[];
          let measured=0;
          for (const [width,height] of [[1440,900],[360,800]]) {
            const context=await browser.newContext({viewport:{width,height},isMobile:width===360,hasTouch:width===360,acceptDownloads:true});
            const page=await context.newPage();
            page.setDefaultTimeout(12000);
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const nav=async route=>{
              await page.locator('.ld-sidebar [data-route="'+route+'"]:visible,.ld-mobile-dock [data-route="'+route+'"]:visible,.ld-mobile-topbar [data-route="'+route+'"]:visible').first().click();
              await page.locator(route==='/'?'[data-home-mode]':'[data-planning-root="'+route.slice(1)+'"]').first().waitFor();
            };
            await page.goto('http://gateway-test');
            await page.locator('#ld-login-secret-input').fill(process.env.LOCAL_LOGIN_SECRET);
            await page.locator('#ld-login-form button[type=submit]').click();
            await page.locator('[data-home-mode=standard]').waitFor();
            for(const route of ['/','/tasks','/records','/metrics','/achievements','/settings']){
              await nav(route);
              const state=await page.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth,heading:document.querySelector('main h1')?.textContent?.trim(),composers:document.querySelectorAll('main [data-planning-form]').length}));
              console.log('ROUTE',JSON.stringify({width,route,...state}));
              assert.ok(state.heading&&state.composers===1,'Main page did not render at '+route);
              if(state.scrollWidth>state.width+1)findings.push({width,route,issue:'horizontal-overflow',amount:state.scrollWidth-state.width});
              measured++;
            }
            await nav('/');
            await page.locator('[data-action=home-open-profile]:visible').first().click();
            await page.locator('[data-subtab=profile].is-active').waitFor();
            console.log('PROFILE',width,'opened via home');
            await page.locator('[data-subtab=wallet]').click();
            await page.locator('[data-subtab=wallet].is-active').waitFor();
            console.log('WALLET',width,'opened in settings');
            await page.locator('[data-subtab=account]').click();
            const exportResponse=page.waitForResponse(res=>new URL(res.url()).pathname==='/api/v1/export');
            const dlPromise=page.waitForEvent('download',{timeout:4500}).catch(()=>null);
            await page.locator('[data-action=export-data]').click();
            const response=await exportResponse;
            const received=await response.json();
            await page.locator('[data-export-status=success],[data-export-status=error]').first().waitFor();
            const outcome=await page.locator('[data-export-status]').first().innerText();
            const version=received.data?.schema_version;
            const dl=await dlPromise;
            if(dl){
              const envelope=JSON.parse(await readFile(await dl.path(),'utf8'));
              assert.ok(envelope.checksum&&envelope.schema_version);
              console.log('EXPORT',JSON.stringify({width,status:response.status(),version,download:true}));
            }else{
              console.log('EXPORT',JSON.stringify({width,status:response.status(),version,download:false,outcome}));
              findings.push({width,route:'/settings',issue:'backup-download-missing',version});
            }
            await nav('/');
            await page.locator('#ld-home-minimal-toggle-btn').click();
            await page.locator('[data-home-mode=minimal]').waitFor();
            await page.reload();
            await page.locator('[data-home-mode=minimal]').waitFor();
            const reportCount=await page.locator('[data-home-mode=minimal] [data-report-generate]:visible').count();
            const exitCount=await page.locator('[data-home-mode=minimal] [data-action=toggle-minimal-mode]:visible').count();
            console.log('MINIMAL',JSON.stringify({width,reportCount,exitCount,persisted:true}));
            if(reportCount)findings.push({width,route:'/',issue:'report-form-inside-minimal-mode'});
            if(!exitCount)findings.push({width,route:'/',issue:'no-direct-return-on-minimal-home'});
            await nav('/settings');
            await page.locator('[data-subtab=display]').click();
            await page.locator('#ld-settings-minimal-toggle-btn').click();
            await page.waitForFunction(()=>document.querySelector('#ld-settings-minimal-toggle-btn')?.getAttribute('data-minimal-mode')==='false');
            await nav('/');
            await page.locator('[data-home-mode=standard]').waitFor();
            console.log('RESTORED',width,'standard home through display settings');
            assert.deepEqual(errors,[]);
            await context.close();
          }
          await browser.close();
          console.log('PAGE_SCANS',measured,'FINDINGS',JSON.stringify(findings));
          if(findings.length)process.exitCode=1;
          JAVASCRIPT
          node .audit-customer-flows.mjs
